<!-- This template expects a NdrCoreUIElement as data -->
<style>
    .ndr-card-linked { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }
    .ndr-card-linked:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
</style>
{% with card_item=data.items.0 %}
    <div class="card{% if card_item.url %} ndr-card-linked{% endif %}" style="width: 18rem;">
        {% if card_item.ndr_image %}
            <img class="card-img-top" src="{{ card_item.ndr_image.image.url }}" alt="Card image cap">
        {% endif %}
      <div class="card-body">
          {% if card_item.url %}
              <a href="{{ card_item.url }}" class="stretched-link"></a>
          {% endif %}

          {% if card_item.title %}
            <h5 class="card-title">{{ card_item.title }}</h5>
          {% endif %}
          {% if card_item.text %}
              <p class="card-text">
                  {{ card_item.text }}
              </p>
          {% endif %}
      </div>
    </div>
{% endwith %}
